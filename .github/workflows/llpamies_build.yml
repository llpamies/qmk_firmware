name: Build 3W6 llpamies Firmware

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QMK_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      # The runner's system python is externally managed (PEP 668), so a bare
      # `pip install` into it fails. setup-python gives us a writable one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc
          python3 -m pip install qmk

      - name: Build
        run: |
          make git-submodule
          qmk compile -kb 3w6/rev2 -km llpamies

      - name: Upload compiled firmware (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: 3W6_llpamies_firmware
          path: 3w6_rev2_llpamies.hex
          if-no-files-found: error
